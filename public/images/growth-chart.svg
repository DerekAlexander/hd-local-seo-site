<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="300" height="300" rx="12" fill="#03191F"/>
<!-- Growth chart bars -->
<rect x="50" y="200" width="36" height="50" rx="4" fill="#5E8AEB" opacity="0.5"/>
<rect x="100" y="170" width="36" height="80" rx="4" fill="#5E8AEB" opacity="0.65"/>
<rect x="150" y="130" width="36" height="120" rx="4" fill="#5E8AEB" opacity="0.8"/>
<rect x="200" y="80" width="36" height="170" rx="4" fill="#FFC348"/>
<!-- Arrow trending up -->
<polyline points="60,210 120,175 170,140 218,90" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
<polyline points="205,78 218,90 206,102" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
<!-- Dollar signs on tallest bar -->
<text x="218" y="170" font-family="sans-serif" font-weight="bold" font-size="22" fill="#03191F" text-anchor="middle">$</text>
<!-- Baseline -->
<line x1="40" y1="255" x2="260" y2="255" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>
